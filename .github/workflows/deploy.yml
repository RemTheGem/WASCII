name: Deploy WASCII

on: 
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url}}

      steps:
        - name: Checkout
          uses: actions/checkout@v6

        - name: Setup Node
          uses: actions/setup-node@v6
          with: 
            node-version: lts/*
            cache: npm

        - name: Install dependencies
          run: npm cl

        - name: Build
          run: npm run Build

        - name: Setup pages
          uses: actions/configure-pages@v6

        - name: Upload workflow_dispatch
          uses: actions/upload-pages-artifact@v5
          with: 
            path: './dist'

        - name: Deploy
          id: deployment
          uses: actions/deploy@v5 